name: Build XGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Setup config files
        run: |
          cp gradle.properties.example gradle.properties 2>/dev/null || true
          cp local.properties.example local.properties 2>/dev/null || true
          echo "TELEGRAM_APP_ID=33758413" >> local.properties
          echo "TELEGRAM_APP_HASH=e9fe420e4e170ff123fd27c3f63c440e" >> local.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          cat > /tmp/google-services.json << 'EOF'
          {"project_info":{"project_id":"xgram","project_number":"1","firebase_url":"https://xgram.firebaseio.com","storage_bucket":"xgram.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:abc","android_client_info":{"package_name":"me.xgram.messenger"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:1:android:def","android_client_info":{"package_name":"me.xgram.messenger.beta"}},"api_key":[{"current_key":"test"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          cp /tmp/google-services.json TMessagesProj/google-services.json
          cp /tmp/google-services.json TMessagesProj_App/google-services.json 2>/dev/null || true
          cp /tmp/google-services.json TMessagesProj_AppStandalone/google-services.json 2>/dev/null || true
          cp /tmp/google-services.json TMessagesProj_AppHuawei/google-services.json 2>/dev/null || true

      - name: Create secrets_for_ci.env
        run: |
          cat > secrets_for_ci.env << 'EOF'
          TELEGRAM_APP_ID=33758413
          TELEGRAM_APP_HASH=e9fe420e4e170ff123fd27c3f63c440e
          RELEASE_KEY_ALIAS=androiddebugkey
          RELEASE_KEY_PASSWORD=android
          RELEASE_STORE_PASSWORD=android
          EOF

      - name: Create debug keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=XGram,O=RK,C=IR"

      - name: Patch DC address
        run: |
          find . -name "ConnectionsManager.cpp" -exec sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "ConnectionsManager.cpp" -exec sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "Datacenter.cpp" -exec sed -i 's/149\.154\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          find . -name "Datacenter.cpp" -exec sed -i 's/91\.108\.[0-9]*\.[0-9]*/193.151.158.60/g' {} \;
          echo "=== Patched DC ==="
          grep -r "193.151.158.60" . --include="*.cpp" -l

      - name: Replace RSA Key and Fingerprint
        run: |
          python3 - << 'EOF'
          import re, glob
          new_key = ""
          new_fp = "0x9dbe5a4c45febeff"
          files = glob.glob("TMessagesProj/jni/tgnet/Handshake.cpp") + \
                  glob.glob("TMessagesProj/jni/tgnet/Datacenter.cpp")
          for f in files:
              try:
                  with open(f, 'r') as file:
                      content = file.read()
                  new_content = re.sub(r'MIIBCgKCAQEA[A-Za-z0-9+/=]+', new_key, content)
                  new_content = re.sub(r'0x[0-9a-f]{16}', new_fp, new_content)
                  with open(f, 'w') as file:
                      file.write(new_content)
                  print(f"✅ Updated: {f}")
              except Exception as e:
                  print(f"⚠️ {f}: {e}")
          EOF

      - name: Rename to XGram
        run: |
          find . -name "strings.xml" | xargs sed -i 's/Cherrygram/XGram/g' 2>/dev/null || true
          find . -name "strings.xml" | xargs sed -i 's/cherrygram/xgram/g' 2>/dev/null || true
          find . -name "*.kt" -o -name "*.java" | xargs grep -l "uz\.unnarsx\.cherrygram" 2>/dev/null | \
            xargs sed -i 's/uz\.unnarsx\.cherrygram/me.xgram.messenger/g' 2>/dev/null || true
          find . -name "*.xml" | xargs sed -i 's/uz\.unnarsx\.cherrygram/me.xgram.messenger/g' 2>/dev/null || true
          find . -name "*.gradle" | xargs sed -i 's/uz\.unnarsx\.cherrygram/me.xgram.messenger/g' 2>/dev/null || true

      - name: Fix Version
        run: |
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' TMessagesProj/build.gradle 2>/dev/null || true
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' TMessagesProj_App/build.gradle 2>/dev/null || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon -x lint 2>&1 | grep -E "error:|FAILED|What went wrong" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xgram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
